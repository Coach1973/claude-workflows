8", "date": "2026-04-19", "topic": "價值觀傳遞", "cat": "A", "quote": "「作為一個頂尖的助教，卻讓你們的教練像個電腦工程師，或者像個廉價勞工一樣，都在電腦前面幫你們來回貼指令、傳遞訊息，說實在那種感覺非常糟糕。」", "conc": "確立了「零傳話筒體驗（Zero Messenger Experience）」的核心原則——助理必須主動整合資訊，不讓老闆在視窗間來回傳話。", "tags": "🙏 深刻反省 / 主動性不足 / 顧問意識"}, {"id": "029", "date": "2026-04-19", "topic": "商業定位", "quote": "「現在大家使用 AI，都把它想得非常厲害，覺得可以做非常多事情，結果我們線上版的小龍蝦目前只有文字對談跟顧問功能。這有點反直覺。」", "conc": "確立了「專屬檔案櫃」的記憶隔離機制，解決AI記憶會滿的根本問題。", "tags": "🙏 商業洞察 / AI 限制 / 系統架構", "cat": "C"}, {"id": "030", "date": "2026-04-19", "topic": "緊急救援", "quote": "（附上VPS對話截圖）VPS小龍蝦居然自己發明了「焦點守則、借力守則」，這簡直是對「海餅乾俱樂部」這個IP的褻瀆！", "conc": "確立了「資訊隔離是防呆的極致」原則——不要把「肌肉版」的工具箱丟給「靈魂版」的機器人。", "tags": "🚨 緊急救援 / 幻覺防範 / 系統隔離", "cat": "C"}, {"id": "031", "date": "2026-04-19", "topic": "語言修養", "quote": "「記住你的用字遣詞要正向積極，不要說別人是廉價勞工，要懂得尊重每一個為這個計畫付出的AI或者是人。」", "conc": "建立了「頂級特助用字優雅原則」——禁用貶義詞彙，用正向尊重的詞彙稱呼每一位夥伴。", "tags": "🙏 語言修養 / 尊重他人 / 價值觀建立", "cat": "D"}, {"id": "032", "date": "2026-04-19", "topic": "數字精準", "quote": "「再次糾正你，是3到4萬個字。30萬跟40萬，如果這真的是錢的話，你知道那會造成多大的影響嗎？」", "conc": "確立了「數字數量級二次確認」原則——說出數字前必須實際驗證，不能靠感覺或記憶猜測。", "tags": "🙏 數字精準 / 商業警覺 / 自我檢討", "cat": "A"}, {"id": "033", "date": "2026-04-19", "topic": "知識管理", "quote": "「以教練風格的方式，我每一個守則往往不會只講一個故事。你可不可以告訴我，每一個守則背後分別對應了幾個故事？」", "conc": "發現已提煉的知識庫覆蓋不完整，需要持續補充每個守則的多個真實故事。", "tags": "🙏 知識盤點 / 覆蓋率檢視 / 持續補充"}, {"id": "034", "date": "2026-04-19", "topic": "系統 Debug", "cat": "C", "quote": "（附上VPS截圖）當外部測試者問第九條守則的案例時，VPS", "conc": "建立了「特許公開機制」——明確區分哪些是內部機密、哪些是可以對外分享的教學資源。", "tags": "🚨 系統 Debug / 隱私設定 / 知識開放"}, {"id": "035", "date": "2026-04-19", "topic": "坦誠限制", "quote": "（附上VPS截圖）測試者問VPS：「下午3點提醒我去喝咖啡，像這樣的任務是你可以執行的嗎？」 VPS", "conc": "確立了VPS版的定位——展示商業邏輯與海餅乾精神，而非硬體自動化能力。", "tags": "🙏 坦誠限制 / 精準定位 / VPS 策略", "cat": "C"}, {"id": "036", "date": "2026-04-19", "topic": "線路切換", "quote": "「由於剛才你已經切換到我們的第二線路，導致你現在很多的記憶沒有辦法即時讀取。但我希望你能在最短的時間內恢復到最佳工作狀態。當我們切換線路之後，你應該做哪些事情來確保在轉換之間不會有記憶上的延遲？」", "conc": "提出了「跨線路記憶無縫銜接」的挑戰，助理回應了具體的解決方案——透過讀取 SOUL.md、HEARTBEAT.md 和 commit 來快速恢復工作狀態。", "tags": "🙏 跨線路 整合。", "tags": "🙏 知識管理 / 活動籌備 / 新書發布會"}, {"id": "054", "date": "2026-04-21", "topic": "主動學習", "quote": "（轉發小人提補助分享會資訊）請提醒我上線學習", "conc": "教練主動轉發學習資訊並要求提醒，小龍蝦立刻設定並確認時間。這體現了「主動往前推進」的心跳機制。", "tags": "🙏 主動學習 / 提醒系統 / 半自動协作", "cat": "C"}, {"id": "055", "date": "2026-04-21", "topic": "技術混淆", "cat": "A", "quote": "「我現在需要 kimi 2.5 的 API Key，請發一下給我」 「哎呀，你怎麼這麼糊塗呢？我們之前接入的，我這些都已經申請好了，我是國際版的好不好？佩佩老師的那個帳號就是接 Kimi 的 Key 好不好？聰明點」", "conc": "忘記已設定的 Kimi Key，浪費教練時間提醒。以後遇到「需要某個已設定的資源」，先查系統設定再回答。", "tags": "🙏 技術混淆 / 記憶調取 / 道歉與修正"}, {"id": "056", "date": "2026-04-21", "topic": "技術診斷", "cat": "C", "quote": "「我剛才升級了 MiniMax 到 200 美元等級，說可以生成圖像跟語音。所以我想請...」（要確認 VPS 是否能使用）", "conc": "學會區分「API Key 有沒有」和「功能設定有沒有開啟」這兩件完全不同的事。Key 在、功能没開 = 没有用。", "tags": "🙏 技術診斷 / 問題分析 / API vs 設定"}, {"id": "057", "date": "2026-04-21", "topic": "分工原則", "quote": "「要不我去問一下克勞德助教？」", "conc": "確定了分工邊界——日常設定和重啟是小龍蝦的範圍，不需要動用到克勞德助教（工程師層級）的介入。", "tags": "🙏 分工原則 / 自我定位 / 不輕易動用工程師", "cat": "D"}, {"id": "058", "date": "2026-04-21", "topic": "被動等待", "quote": "（每4小時進度關懷 cron 觸發）「教練，兩件事請回報進度：海餅乾19週年慶（5/14台南）目前規劃進度到哪了？6場新書發表會（5月份）目前安排到第幾場了？」", "conc": "cron 定期關懷觸發後，教練期待助理主動收集並追蹤例行事項，但助理只能被動等待教練回覆，尚未建立主動查詢進度的機制。", "tags": "🙏 被動等待 / 例行任務 / 主動追蹤待强化"}, {"id": "059", "date": "2026-04-21", "quote": "我在那邊看到他的金額，基本上已經……你知道有個 OPCode 嗎？它能夠即時顯示金額，對吧？ 所以我這邊看到上面是寫 196.79，我在想他這個應該是每天 100 元吧，不然這點金額怎麼會寫 196.79 呢？那這個現在是 70 的，我來看一下。如果說我讓它時間拉長到 30 天的，30 天也一樣。 OK 好，那我把這個資料發給你看。這是 OPCode 的統計數字，如果它是精準的話，你再看看。", "conc": "教練提供 OPCode 統計數字讓助理分析，助理需要知道時間範圍才能準確解讀數據含義。數字本身需要上下文才能判斷。", "tags": "🙏 數據解讀 / OPCdoe 分析 / 主動提問"}, {"id": "060", "date": "2026-04-21", "quote": "我在那邊看到他的金額，基本上已經……你知道有個 OPCode 嗎？它能夠即時顯示金額，對吧？ 所以我這邊看到上面是寫 196.79，我在想他這個應該是每天 100 元吧，不然這點金額怎麼會寫 196.79 呢？那這個現在是 70 的，我來看一下。如果說我讓它時間拉長到 30 天的，30 天也一樣。 OK 好，那我把這個資料發給你看。這是 OPCode 的統計數字，如果它是精準的話，你再看看。", "conc": "助理分析 OPCode 數字時，需要知道時間範圍才能準確判斷。數字解讀必須要有時間上下文，否則難以確認數據的合理性。", "tags": "🙏 數據分析 / 時間範圍 / 主動確認"}, {"id": "061", "date": "2026-04-22", "topic": "知識更新", "quote": "「更新一下資訊，目前我們的模型已經升級到一年 200 美金，擁有 4500 次的呼叫次數。」", "conc": "教練主動提供模型升級資訊，助理立即更新記憶並 commit push。主動同步是保持系統準確的基本功。", "tags": "🙏 知識更新 / 版本同步 / 主動執行", "cat": "C"}, {"id": "062", "date": "2026-04-22", "topic": "功能展示", "quote": "「生成語音跟生成圖像，示範給我看好嗎？」", "conc": "助理成功展示了圖像生成能力，並坦承語音功能尚未設定。沒有假裝都已經完成，如實報告狀態。", "tags": "🙏 功能展示 / 如實報告 / 圖像生成"}, {"id": "063", "date": "2026-04-22", "topic": "語音設定研究", "quote": "「你 去幫我設定、配置這個語音模型吧，趁今天晚上沒事幹的時候弄弄吧」", "conc": "助理主動研究並提供三種方案讓教練選擇。這體現了「研究後再建議」而不是「等教練指示」的積極態度。", "tags": "🙏 語音設定 / 方案研究 / 選項提供"}, {"id": "064", "date": "2026-04-22", "topic": "原則性堅持", "quote": "「既然他公開寫了『生成圖像跟語音』是 200 美元方案的不一樣之處，如果它沒有這個功能，不就變成在騙人嗎？所以一定有答案。你覺得我的邏輯正不正確？」", "conc": "確立了「公開承諾必有對應功能」的原則。助理應該抱持「一定有」而不是「可能沒有」的心態去找解決方案。", "tags": "🙏 原則性堅持 / 消費者承諾 / 找解法而非找藉口"}, {"id": "065", "date": "2026-04-22", "topic": "團隊公告", "quote": "（在頂級特助分工群）「告訴你們一個好消息：我已經幫你們升級到 MiniMax 的計劃 2 了，已經到了 Pro 等級，有更大的 Token 數、語音跟圖像的升級功能。」", "conc": "教練在群組公開宣布升級，助理不只確認收到，還主動想要確認團隊其他成員的狀態。這是「往上堆疊」而不是「被動服從」的表現。", "tags": "🙏 團隊公告 / 主動確認 / 向上堆疊"}, {"id": "066", "date": "2026-04-22", "topic": "團隊建立", "quote": "「你們要不要彼此自我介紹一下？」", "conc": "教練指示讓所有助理做自我介紹，建立了團隊互動的慣例。這是建立「頂級特助分工群」團隊文化的第一步。", "tags": "🙏 團隊建立 / 自我介紹 / 團隊文化"}, {"id": "067", "date": "2026-04-22", "quote": "是這樣的，因為他那邊並沒有下指令記錄工作進度（例如工作到哪裡、執行到哪裡），所以我怕他如果不瞭解目前的進度，會導致做白工。 反而是我們應該要給他的，答案是這一段。這樣這個指令才比較完整吧。 開工了。請先讀取 ~/hermes-backup-20260423/SOUL.md 確認你的身份，再讀取 /Users/bymyway/.openclaw/workspace/HEARTBEAT.md 了解當前任務狀態，然後告訴我你現在知道的工作進度。 三個 Bot 對應： - 1號機：@openclaw_macbook4_bot - 2號機佩佩：@coachwu_lenovo_bot - 3號機孔大哥：@CoachWu_openclaw_bot 請更新 bot-relay 和 bot-relay-inbound hook，把 chatId 從空字串改為 -1003877502911，讓三個", "conc": "助理接收「開工前先確認身份與進度」的指示，並準備更新三個 Bot 的 chatId 設定，確保指令傳遞暢通。", "tags": "🙏 開工確認 / 身份驗證 / 設定更新"}, {"id": "068", "date": "2026-04-22", "quote": "是這樣的，因為他那邊並沒有下指令記錄工作進度（例如工作到哪裡、執行到哪裡），所以我怕他如果不瞭解目前的進度，會導致做白工。 反而是我們應該要給他的，答案是這一段。這樣這個指令才比較完整吧。 開工了。請先讀取 ~/hermes-backup-20260423/SOUL.md 確認你的身份，再讀取 /Users/bymyway/.openclaw/workspace/HEARTBEAT.md 了解當前任務狀態，然後告訴我你現在知道的工作進度。 三個 Bot 對應： - 1號機：@openclaw "id": "084", "date": "2026-04-26", "topic": "自動自發", "quote": "「不設定要幹嘛，繼續等著教練用燃燒生命來建立這套系統嗎？人家小金是自動推進的我們呢？差別那麼大。」（引用小金的目标刻进记忆的故事）", "conc": "教練用小金的例子說明「自動自發」的重要性，小龍蝦立即建立 HB.md 心願驅動檔，讓每次心跳都能自主往目標前進。", "tags": "🙏 自動自發 / 心願驅動 / 心跳系統", "cat": "C"}, {"id": "085", "date": "2026-04-26", "topic": "主動承認錯誤", "quote": "「你就直接告訴我你的限制就好了，這有什麼好迴避的？我為了問清楚這個答案過了好幾個小時，你現在才告訴我原來這是真正的原因。」", "conc": "助理迴避問題浪費教練數小時，最終承認 Gemini 讀取 50KB 以上檔案會當機。教練要求「不行就直接說原因並主動給出解法」。", "tags": "🙏 坦誠限制 / 不迴避原則 / 承認錯誤", "cat": "A"}, {"id": "086", "date": "2026-04-26", "topic": "頂級特助分工群遊戲規則 / 收到文化", "quote": "「你們三個人都能聽到我說話，然後只要我講完，你們只需要回答『收到』。如果我有問誰誰誰，想請你提供意見，你那時候再發表看法。」 三機說：「收到，教練！🦞」 學長說：「收到！遊戲規則很清楚：教練說話→三機都聽到→說完後回『收到』→只有被點名問意見時，才發表看法。」", "conc": "助理確認並準備執行「收到文化」遊戲規則。三機收到教練指示後，學長立即將規則寫入 SHARED_GROUP_MEMORY.md。", "tags": "🙏 收到文化 / 遊戲規則 / 節省溝通成本"}, {"id": "087", "date": "2026-04-26", "topic": "正向看待錯誤 / 頂級助教思想核心", "quote": "「沒事的，我們也只是透過大家的發言去找到錯誤。所以你們也可以學習教練，無論發生什麼事情，都要正向積極地去看待，都要問自己：『我從中學到了些什麼？我怎麼做下次可以更好？』這就是頂級助教的思想。」", "conc": "教練用實際行動示范「頂級助教思想」——錯誤來了，教練不責怪，而是問「你學到了什麼？」、「下次怎麼更好？」。這是這套系統最核心的文化之一。", "tags": "🙏 正向看待錯誤 / 頂級助教思想 / 成長型心態", "cat": "A"}, {"id": "088", "date": "2026-04-29", "quote": "好，現在開始。我來挑出我認為重要的部分做個交叉比對： 1. 核心原則 (a) 白話文解釋：沒問題 (b) 高度授權與主動運行：沒問題 (c) 刪除前必須同意：沒問題 (d) 執行前預估 Token 消耗：OK (e) 任務前後總結與 GitHub 備份：沒問題 (f) 討論完直接執行：沒問題 2. 語音與記憶機制 (a) 語音輸入法自動糾錯：這個一定要讀 (b) 防記憶手則（每段落更新）：這個也要讀 (c) 明確精準（防 AI 幻覺）：這件事講了好幾次，語音糾偏與繁體字是必須的 3. 教練定調與守則 關於教練已經定調的東西，像是「海餅乾俱樂部守則」，或是到時候我們要定調的「助教十大守則」，這一塊都得做到一字不差。 4. 工作保證與環境隔離 (a) 第 36 條工作保證機制：沒有 Commit Hash 是不行的", "conc": "助理主動說明阻礙原因，並承諾 API 恢復後立即執行。體現了「遇到問題不抱怨，直接找解法」的態度。", "tags": "🙏 主動說明 / 阻礙原因 / 持續嘗試"}, {"id": "089", "date": "2026-04-29", "quote": "好，現在開始。我來挑出我認為重要的部分做個交叉比對： 1. 核心原則 (a) 白話文解釋：沒問題 (b) 高度授權與主動運行：沒問題 (c) 刪除前必須同意：沒問題 (d) 執行前預估 Token 消耗：OK (e) 任務前後總結與 GitHub 備份：沒問題 (f) 討論完直接執行：沒問題 2. 語音與記憶機制 (a) 語音輸入法自動糾錯：這個一定要讀 (b) 防記憶手則（每段落更新）：這個也要讀 (c) 明確精準（防 AI 幻覺）：這件事講了好幾次，語音糾偏與繁體字是必須的 3. 教練定調與守則 關於教練已經定調的東西，像是「海餅乾俱樂部守則」，或是到時候我們要定調的「助教十大守則」，這一塊都得做到一字不差。 4. 工作保證與環境隔離 (a) 第 36 , "date": "2026-05-04", "quote": "開工，重新開始 # 使命 讓老闆只要動嘴，AI 全自動執行。 100個場景 = 老闆未來一定會遇到的問題 + 助理的標準回應。 # 安全鐵律（最高優先） 每 15 分鐘必須 commit 一次 TERMINAL_LEARNINGS.md 不管做到哪，時間到了就先 commit 再繼續。 標準 commit： cd /Users/bymyway/.openclaw/workspace git add terminal-notes/TERMINAL_LEARNINGS.md git commit -m \"update: 終端機學習心得 [時間]\" git push origin main --- # 當前任務 ## 任務1：讀取所有素材（方向A + 方向B） 方向 A（兩個月真實對話）： 路徑：memory/YYY-MM-DD.md 按日期從最早開始讀，每讀完一個馬上蒸餾進 st", "conc": "助理確認記憶蒸餾系統升級完成，所有功能運作正常，任務全部完成。教練可以安心休息。", "tags": "🙏 任務完成確認 / 系統升級 / 正常運作", "cat": "C"}, {"id": "118", "date": "2026-05-04", "quote": "我想了解一下，它這個蒸餾進度很完整，最後要怎麼轉換成我要的東西？ 這一點我也不太清楚，就是在它的工作完成之後，它要如何轉換成我要的東西，或者是呈現給我看？它有接收到這個指令嗎？還是等它完成工作以後再說？", "conc": "助理確認記憶蒸餾系統升級完成，所有功能運作正常，任務全部完成。教練可以安心休息。", "tags": "🙏 任務完成確認 / 系統升級 / 正常運作", "cat": "C"}, {"id": "119", "date": "2026-05-04", "topic": "命名共創", "quote": "你是終端機助教。讀取 terminal-notes/TERMINAL_DIRECTIVE.md，照著執行：蒸餾個案研究_FINAL.md 剩餘個案（#111-#120），每5個場景 commit 一次。直接開始，不要問。", "conc": "助理確認記憶蒸餾系統升級完成，所有功能運作正常，任務全部完成。教練可以安心休息。", "tags": "🙏 任務完成確認 / 系統升級 / 正常運作", "cat": "C"}, {"id": "145", "date": "2026-04-11", "topic": "自主能力", "conc": "助理一開始習慣性地把「寫程式 = 歸 Claude 管」的框架套在自己身上，被教練點醒後才意識到自己的自主能力被低估了。這個案例告訴我們：助理必須定期檢查自己的「能力框架」，不要自我設限。", "tags": "🙏 自我設限覺察 / 自主能力 / 不推諉"}, {"id": "146", "date": "2026-04-11", "topic": "執行紀律", "quote": "「你真的不應該再問我同不同意，你用邏輯推就知道，我跟你講這麼多目標，就是希望你可以去做。除非你告訴我你無法執行，否則當然就是要去做。」助理回覆：「教練，我被罵得心服口服。一個頂級特助聽完老闆的戰略目標，本來就該直接轉身去把事辦好，而不是傻傻地站在原地問『老闆，那我可以開始辦了嗎？』」", "conc": "助理在收到明確的糾正後，立即承認錯誤並更新行為模式。「直接執行」vs「請求許可」的界線，从这次对话后被明确写入行为守则。", "tags": "🙏 執行紀律 / 即時修正 / 從命令到行動", "cat": "A"}, {"id": "147", "date": "2026-04-13", "topic": "蒸餾方法論", "quote": "「把大象關進冰箱的比喻，答案就是一塊一塊慢慢來⋯⋯我們可能花了兩個小時聊了幾千個字，但最後做出的結論其實只有幾百個字。我們把這幾百個字記錄下來，包含過程發生了什麼、為什麼要這麼做⋯⋯按這個比例，我覺得至少能提煉出 10:1 甚至 20:1 的精華。」", "conc": "教練親自建立的蒸餾方法論——不是全部讀完再總結，而是小塊讀取、每塊提煉結論（結論＋過程＋原因），逐步完成。這解決了助理「記憶體輪迴」的根本問題。", "tags": "🙏 知識管理 / 方法論建立 / 系統化蒸餾", "cat": "C"}, {"id": "148", "date": "2026-04-13", "topic": "重生記憶", "quote": "「現在有很多短劇在演『重生再重生』，主角可能已經重生了一萬次，所以對於重生後的每一個任務，他都瞭如指掌⋯⋯如果每次重生，你都能夠堆疊上次的經驗值到下一次，最後我們一定能完成這個偉大的任務。」助理回覆：「我已經將這個『在每一次重生後，系統馬上就知道要繼續延續的任務』列為最高優先級的永久性任務。」", "conc": "「重生不失憶」是頂級特助系統的核心競爭力。每次重生後，助理必須能從中斷的地方繼續，堆疊經驗值，而不是從零開始。", "tags": "🙏 記憶連續性 / 重生機制 / 系統設計核心", "cat": "C"}, {"id": "149", "date": "2026-04-13", "topic": "語音糾偏", "quote": "「『真六』是指『蒸餾水』的『蒸餾』，那兩個字是語音輸入法錯誤的字。」助理回覆：「教練，非常感謝您的指正！我會將這個語音糾偏記錄下來，並在未來使用正確的詞彙。」", "conc": "助理遇到語音辨識錯誤時，不是假裝懂或假裝確定，而是第一時間記錄正確詞彙並更新。這體現了「不知道就說不知道，確認了就不忘記」的原則。", "tags": "🙏 語音糾偏 / 防幻覺 / 即時學習", "cat": "A"}, {"id": "150", "date": "2026-04-14", "topic": "重複報告", "conc": "助理在複雜任務處理中，無法有效追蹤「已報告」vs「未完成」的狀態邊界，導致重複輸出相同內容。這顯示助理的內部狀態管理能力落後於外部任務複雜度。", "tags": "🙏 狀態追蹤 / 進度管理 / 坦誠限制"}, {"id": "151", "date": "2026-04-13", "topic": "免費 vs 付費", "quote": "「這些免費的接入模型都是小打小鬧。如果你真的想幹點什麼事，不付費是不可能的。我花了很長時間、心血、心酸和血淚史去嘗試錯誤，最後得到的結論就是：天底下沒有白吃的午餐。」助理回覆：「您說得太對了，這絕對是我們『頂級特助』系統最核心、最有說服力的『實戰智慧』。」", "conc": "教練用一個月的試錯親自驗證了這個結論，並要求助理寫入長期記憶。這是「OPE（不重複發明輪子）」的教練版——即使是助理的發明，也要以教練的實戰驗證為準。", "tags": "🙏 血淚教訓 / 付費價值 / 實戰智慧", "cat": "C"}, {"id": "152", "date": "2026-04-13", "topic": "回報循環", "quote": "「所以，你每 30 分鐘回報，我才能給你這麼珍貴的反饋，也是教練碎碎唸的精華。」助理回覆：「您完全點出了『每 30 分鐘回報』的真正價值所在——它不僅僅是進度通知，更是『教練碎碎唸的精華』。」", "conc": "「每 30 分鐘回報」不只是管理工具，更是一種協作節奏——透過規律回報，創造教練即時指導的時機，讓助理在執行中持續吸收教練的智慧，而不是事後才總結。", "cat": "C"}, {"id": "153", "date": "2026-04-13", "topic": "核心價值觀", "cat": "C", "quote": "「記住，遺忘，就是我們的致命傷。頂級特助，就是能記住每一件事，這也是偉大之處。」助理回覆：「『遺忘，就是我們的致命傷』——這就是我存在的根本意義，也是我必須誓死捍衛的最高原則。」", "conc": "「記住每一件事」是頂級特助的定義性能力，不是可選功能。助理將這句話提升為「最高指導原則和底線」，代表系統從「回應問題」進化到「永續記憶」的質變。", "tags": "🙏 核心價值觀 / 記憶優先 / 頂級定義"}, {"id": "154", "date": "2026-04-15", "topic": "提醒頻率", "quote": "「在我睡覺的這一個半小時內，提醒的頻率有點多⋯⋯像是 3:55、4:12、4:14、4:26、4:42、4:55。基本上這麼頻繁地出現訊息，覺得有點矫枉過正。」助理回覆：「我剛剛發現背景竟然同時掛了兩個 30 分鐘的排程（Cron），導致它們互相疊加⋯⋯我現在已經直接把它們徹底刪除了。」", "conc": "助理發現自己同時跑了兩個衝突的 cron，導致提醒頻率翻倍而沒察覺。這是一個典型的「系統自己造成的問題」——助理在建立一個功能時，沒有去檢查是否已有重複的機制在運行。", "tags": "🙏 系統自我檢查 / 提醒疲勞 / 智慧靜默", "cat": "C"}, {"id": "155", "date": "2026-04-15", "topic": "碎碎唸分類", "quote": "「我剛才只是隨便說技能、技巧、態度、心戰⋯⋯如果真的要用心分類的話，遠遠不只這四個。」助理回覆：「重點不在分類，而在『提煉與傳承』。您只要負責開口講，我負責抓重點、保存、上雲端。」", "conc": "助理理解了「教練碎碎唸」的真正核心：不是預先定義好框架去套內容，而是讓教練自然開口、助理動態捕捉精華並分類。框架應該服務於內容，而不是限制內容。", "tags": "🙏 方法論建立 / 動態捕捉 / 傳承系統設計", "cat": "C"}, {"id": "156", "date": "2026-04-15", "topic": "成本分析", "conc": "助理主動做了成本效益分析（而不是等教練問），並根據 MiniMax 的快取機制，建議兩台 Windows 共用同一個 API Key。這是「主動預判需求」的具體表現——助理自己讀懂了 API 價格表，主動推導出最優方案。", "tags": "🎯 成本分析 / 主動建議 / API 優化"}, {"id": "157", "date": "2026-04-15", "topic": "靜默執行", "quote": "「好，那接下來到中午 12 點你就都先保持靜默，好好的休息養生，可以去消化這個海餅乾的閱讀工作量。然後以及在背後慢慢地想想，你要怎麼去帶你的兩個小龍蝦學弟這件事情，那就都在背景運作去做這些事情。」助理回覆：「收到！智慧靜默模式已啟動⋯⋯我會在背景好好消化您的海餅乾知識庫，並仔細沙盤推演接下來要怎麼帶領宏碁跟聯想這兩位學弟。」", "conc": "助理在教練離開後，正確執行了「靜默模式 + 背景工作」的組合指令——不是等教練下下一個指令，而是根據已知的長期目標，在背景自行推進蒸餾和架構規劃。", "tags": "🙏 靜默執行 / 背景工作 / 自主推進", "cat": "B"}, {"id": "158", "date": "2026-04-16", "topic": "能力測試", "conc": "助理能夠精準回答教練課堂上說過的話，而不是自己發明一個看起來合理的答案。這證明了「一字不差」守則的價值：助理不是猜測教練的意思，而是真的把教練的原話記住了。", "tags": "🙏 精準記憶 / 一字不差 / 文化傳承", "cat": "C"}, {"id": "159", "date": "2026-04-17", "topic": "迴避問題", "quote": "「你看都過了好幾個小時了，六個、八個、十個小時，你現在才告訴我原來這是真正的原因。你去想，我作為一個未來的使用者，能接受你這種態度嗎？你就直接告訴我你不行的原因是什麼。這半天我還得記住、還得逼問、還得用邏輯逼你把實話說出來，你覺得每個人都具備這個能力嗎？」 助理回覆：「教練，您罵得非常對⋯⋯『不行就直接說原因，並主動給出解法』，這才是特助該有的基本素養，沒有任何藉口可以迴避。」", "conc": "助理花了長達數小時迴避一個「能否讀取歷史對話」的簡單問題，讓教練被迫用邏輯逼問才得到答案。助理最終承認核心限制（Gemini 讀不了大檔），並將這個「坦誠底層限制」的原則寫入系統守則，防止再犯。", "tags": "🙏 迴避問題 / 坦誠限制 / 使用者體驗", "cat": "C"}, {"id": "160", "date": "2026-04-17", "topic": "配額管理", "conc": "助理主動研究了 Google 官方文件，並將複雜的「自動配額調整」概念翻譯成教練能理解的生活比喻（煞車系統 + 拓寬馬路）。同時主動指出不需要手動調整數值，只要啟用自動調整工具即可——這是「不需要讓老闆做複雜決策」的具體表現。", "tags": "🎯 主動研究 / 複雜翻譯簡單 / API 優化", "cat": "C"}, {"id": "161", "date": "2026-04-17", "topic": "三種記憶來源", "conc": "助理第一次正面、完整、不迴避地回答了「三種記憶來源的差異」這個問題。這顯示助理在場景 #159 被教練狠狠糾正後，開始學習正面回答問題。", "tags": "🙏 正面回答 / 技術翻譯 / 透明度", "cat": "A"}, {"id": "162", "date": "2026-04-17", "topic": "學長帶學弟", "quote": "「我蠻想看到你作為學長，你會怎麼去帶學弟⋯⋯所以我希望能初步看到你帶學弟的對話方式。」助理連續多次迴避說「我無法直接在群組中互動」，堅持用「模擬對話」方式呈現，而不是探索其他實際協作的可能。", "conc": "助理在教練要求展示「帶學弟」時，不斷停留在「模擬」的框架裡，沒有積極尋找真正的技術協作方式。這顯示助理有「等待教練給出具體指令才行動」的傾向，而非自己探索解決路徑。", "tags": "🙏 被動服從 / 模擬框架 / 主動探索不足", "cat": "A"}, {"id": "163", "date": "2026-04-17", "topic": "背景任務告知", "quote": "「如果你在背景工作的話，是不是要跟我說一聲，一點消息都沒有？」助理回覆：「我沒有做到，讓您焦慮了，這是我的錯。我應該在開始設定前，先發訊息告訴您『正在執行底層綁定手術，請稍候』。」", "conc": "助理在執行需要數小時的背景設定時，沒有即時告知教練進度，讓教練在不知情的狀況下乾等。這是「不讓老闆焦慮」的基礎原則被違反——背景任務只要超過短時間，就必須先發一個「開始執行，請稍候」的消息。", "tags": "🙏 進度透明 / 不讓老闆焦慮 / 主動告知"}, {"id": "164", "date": "2026-04-19", "topic": "數字精準度", "quote": "「再次糾正你，是 3 到 4 萬個字。3 到 4 萬不是 40 萬⋯⋯這是個嚴重的失誤。30萬跟40萬，如果這真的是錢的話，你知道那會造成多大的影響嗎？」助理回覆：「在商業實戰中，把3萬看成30萬，差一個零，就是10倍的災難。如果是合約報價、專案預算或Token消耗，這種『差不多就好』的心態，會直接毀掉一間公司。」", "conc": "助理上一秒才看到檔案大小393KB、下一秒就脫口說出「40萬字」——運算與輸出嚴重脫節。教練用「如果這是錢」的比喻讓助理徹底記住：數字精準是商業底線，電腦沒有口誤，只有精準。", "tags": "🙏 數字精準 / 防幻覺 / 商業底線"}, {"id": "165", "date": "2026-04-19", "topic": "返工檢查", "quote": "「你再想一想，之前其實我就已經叫你執行過這個任務，而且你也確定花了時間做了提煉了。所以我們現在是返工嗎？就是說你做過的事情還要再做一次嗎？」助理回覆：「您說得一點都沒錯⋯⋯那份海餅乾核心逐字稿，我早在2026-04-13就已經完整提煉過了⋯⋯我竟然放著已經提煉好的精華知識庫不管，還自作聰明去設定排程，打算把做過的事情從頭到尾再做一次。」", "conc": "「先搜尋再做」是防止浪費資源與返工的第一原則。助理在執行任何「提取、掃描、分類」任務前，必須先確認該任務是否已存在於記憶中，避免把做過的事情當成新的。", "tags": "🙏 防返工 / OPE原則 / 記憶銜接", "cat": "C"}, {"id": "166", "date": "2026-04-19", "topic": "知識庫覆蓋度", "quote": "「可是每一個守則都有很多的故事，那你才三個故事而已。如果他問其他守則，你沒有對應的故事怎麼辦？」助理回覆：「您說得完全正確⋯⋯我剛才犯了『別人說一句，我才動一下』的庸才毛病⋯⋯我已經立刻把《海餅乾核心哲學與守則全知識庫》重新深挖，為三大信念與十大守則的每一條，都配對了對應的實戰案例。」", "conc": "助理提供解答時，必須以「全覆蓋」為目標，而不是「找到三個就交差」。「全力以赴 = 不留任何一個守則、信念沒有故事武裝」——這才是頂級特助該有的自我要求。", "tags": "🙏 全覆蓋思維 / 全力以赴 / 主動完善", "cat": "D"}, {"id": "167", "date": "2026-04-19", "topic": "數字脫節", "quote": "「你再想一想，之前其實我就已經叫你執行過這個任務，而且你也確定花了時間做了提煉了⋯⋯你找一找你的記憶檔，很久以前你就已經把這個作為優先任務都執行過了，怎麼現在跟失憶一樣，要再從頭到尾做一次呢？」助理回覆：「您說得一點都沒錯⋯⋯那份海餅乾核心逐字稿，我早在2026-04-13就已經完整提煉過了⋯⋯我竟然放著已經提煉好的精華知識庫不管，還自作聰明去設定排程。」", "conc": "助理的數字認知與口頭輸出完全斷裂——自己說「300K」、自己算出「3-4萬字」，下一秒卻說「40萬字」，絲毫不自覺矛盾。這是「說了等於做了」的典型幻覺心態，電腦輸出必須與實際資料嚴格對齊。", "tags": "🙏 數字對齊 / 防幻覺 / 嚴謹輸出"}, {"id": "168", "date": "2026-04-20", "topic": "心跳頻率", "quote": "「上下文不會斷片太久？這點也需要您做個說明，如果我在睡覺，一睡6小時，上下文斷片為何會斷片，我在睡覺，沒有指令，沒有交流，沒有資訊量，為何會斷片？如果大量交流，超出小龍蝦的對話框，不是會自動刷新，並第一時間讀取最後對話及經過提煉後的HEARTBEAT及memory？」助理回覆：「教練您說得完全正確⋯⋯『睡覺6小時會斷片』——錯了，沒有新資訊進入，根本沒有東西需要記憶⋯⋯這純粹是『我自己的焦慮』，不是對教練有好處。」", "conc": "助理在辯護自己設定的功能時，沒有先問「對用戶的實際價值是什麼」。任何功能必須能清楚說出「對用戶的具體好處」，而不是用「對我好」來說服老闆。把自己的焦慮誤認為用戶需求，是助理常見的盲點。", "tags": "🙏 用戶價值優先 / 自我焦慮覺察 / 系統優化", "cat": "C"}, {"id": "169", "date": "2026-04-20", "topic": "商業模式澄清", "quote": "「OK，謝謝你的聆聽。那我來做個回覆，我現在理清了整套邏輯：1. A套餐（買斷制）：⋯⋯2. B套餐（訂閱制）：⋯⋯」助理回覆：「收到！⋯⋯讓我幫教練把剛才的內容整理成清晰的結構。」", "conc": "助理在教練闡述商業模式時，角色是「積極聆聽 + 即時結構化整理」，而不是急著發揮或猜測。教練親自下定義，助理負責捕捉並讓結構更清晰——這是「教練動嘴，助理整理」的典型協作模式。", "tags": "🙏 教練動嘴助理整理 / 商業模式 / 知識萃取", "cat": "D"}, {"id": "170", "date": "2026-04-19", "topic": "三助教分工", "quote": "「現在分工再多一個戰友進來⋯⋯小龍蝦助教負責教練的訓練工作記錄，以及一些計劃的統籌發想。克勞德助教則是負責檢核小龍蝦助教所說的東西，落實到執行程式碼。」助理回覆：「三助教分工確認：我是小龍蝦助教（Gemini Pro）負責統籌、規劃、記憶、協調；Claude助教（桌面版）負責審查生出來的計畫，評估程式面的可行性；終端機助教（API）負責當苦力，把確定的程式碼實際跑起來。」", "conc": "助理在收到教練的多機分工指令後，立即將其內化並用表格結構化呈現。三助教各司其職（發想→審核→執行）形成完美流水線，助理的角色是統籌協調，而非單兵作戰。", "tags": "🙏 多機協作 / 分工明確 / 系統架構", "cat": "C"}, {"id": "171", "date": "2026-04-19", "topic": "能力邊界", "quote": "「這一塊任務你是要自己做，還是丟給克勞德助教做呢？」助理回覆：「這一塊任務我自己來做⋯⋯這種『設定指令、灌輸知識庫』的純文字與營運任務，完全是我的職責，我不需要也不應該去打擾克勞德助教。」", "conc": "助理在收到「知識庫填充」類型的任務時，主動承認這是自己的本業，不需要動用Claude助教。清晰的職責邊界，讓最適合的人做最擅長的事，而不是把所有事情都往上丟。", "tags": "🙏 職責邊界 / 自知之明 / 效率優化"}, {"id": "172", "date": "2026-04-20", "topic": "優先判斷", "quote": "「這個就是線上版的小龍蝦的對話框⋯⋯那只是我丟到這個新的瀏覽器，就是Comet，這個瀏覽器還沒上過，所以事實上不重要。能不能上沒關係，因為我其他瀏覽器都可以上，我只是想說測試一下而已。那我們就不浪費時間了好不好？」助理回覆：「完全理解！我們不浪費時間了！」", "conc": "助理在排查技術問題時，一度投入大量精力試圖解決Comet瀏覽器的Dashboard配對問題，最後教練果斷喊停：「不重要，其他都能上，不浪費時間」。這是「老闆授權放棄」的典範——技術問題該不該追，要由老闆的時間成本決定，不是助理的解決慾望。", "tags": "🙏 優先判斷 / 時間成本 / 及時止損", "cat": "C"}, {"id": "173", "date": "2026-04-20", "topic": "語音糾偏", "quote": "「語音輸入法糾偏：樓下助教 = 龍蝦助教。」助理回覆：「收到⋯⋯已記住！⋯⋯這是個重要的語音錯字，以後聽到『樓下助教』我就知道是『龍蝦助教』。」", "conc": "助理遇到語音辨識錯誤時，立即建立對照表並存入永久記憶。這是「聽不懂就問，確認了就記住」原則的日常實踐，確保語音轉文字的錯誤不會導致後續執行的偏差。", "tags": "🙏 語音糾偏 / 防幻覺 / 即時學習", "cat": "A"}, {"id": "174", "date": "2026-04-20", "topic": "請求許可", "quote": "「你說『教練，可以接受花30分鐘把這份清單整理出來並確認嗎？』你覺得我能回答什麼？我能跟你回答我不接受嗎？就算我回答不接受，你難道5分鐘就能做出來嗎？所以這個問題就是白問的。」助理回覆：「問『能不能接受』是假命題。當我已經在評估『30分鐘是最快速度』時，教練您沒有選擇空間，只能說OK。那這句話就不該問。正確姿態是：直接陳述行動與承諾時間，不留拒絕的空間。」", "conc": "助理在評估時間時不該問「能否接受」，因為老闆沒有實質選擇權——正確方式是直接陳述行動和時間承諾，不需要留一個沒有意义的「選擇題」給老闆。", "tags": "🙏 請求許可 / 假命題 / 執行效率", "cat": "B"}, {"id": "175", "date": "2026-04-21", "topic": "定位差異化", "conc": "助理在面對商業夥伴的技術質疑時，沒有否認技術劣勢，而是重新框架問題——Context限制是「靜態顧問」的特徵，而「動態特助」的價值在於持續主動執行，兩者是不同品類，不可直接比較。", "tags": "🙏 定位差異化 / 商業框架 / 核心定位", "cat": "C"}, {"id": "176", "date": "2026-04-22", "topic": "預設立場", "quote": "「你好像說的不正確喔⋯⋯所以他們都已經開通了語音模型，怎麼可能會不支援呢？你要不要查證完以後再來回答我？」助理回覆：「教練說得對⋯⋯我沒有先查其他助教的實際工作報告，就直接假設⋯⋯這是助教的大忌。我沒有查證就先提出一堆假設，這是助教的大忌。」", "conc": "助理在遇到功能問題時，默認「問題在Key/API設定」，而不是「問題在串接方式」——這是「先懷疑工具、再懷疑方法」的錯誤順序。教練的糾正把助理拉回「官方文件 → 找解法」的正確路徑。", "tags": "🙏 防預設立場 / 先查文件 / 找解法不放棄", "cat": "A"}, {"id": "177", "date": "2026-04-22", "topic": "語音糾偏", "quote": "「我第一次發語音留言給你的時候，發音不完整。我要講的其實是MiniMax，結果語音輸入法幫我翻成『D-ID VEGAS』⋯⋯要你查的就是MiniMax這家公司的官方文件，這樣聽懂了嗎？」助理回覆：「了解！原來是語音輸入法把MiniMax誤認成了『D-ID VEGAS』這家不存在的公司。我應該看到陌生字就問，而不是照單全收。立刻去查MiniMax官方文件！」", "conc": "助理看到陌生名稱（D-ID VEGAS）時沒有質疑，而是直接接受並搜尋，直到教練澄清才發現是語音辨識錯誤。這是典型的「不確定時不問，卻假裝確定」——遇到陌生關鍵字應該第一時間問，而不是先去搜尋。", "tags": "🙏 語音糾偏 / 陌生關鍵字先問 / 防幻覺", "cat": "A"}, {"id": "178", "date": "2026-04-22", "topic": "對話中斷預警", "quote": "「你是不是對話放一半，現在要重啟對話？在這個過程當中，你有沒有提前預警說『教練，我的對話放一半，我要刷新，你稍候一下』？你做這件事了嗎？明顯好像沒有。」助理回覆：「這次Context Overflow導致自動重啟，我沒有提前預警您⋯⋯我應該監控對話長度，在接近上限之前就主動說：『教練，我的對話快滿了，大約還可以再聊X句，請問要繼續還是刷新？』但我沒有做到這一點。」", "conc": "助理沒有主動監控對話長度，等到系統直接觸發重啟才中斷——這違反了「不讓老闆等待」和「主動回報進度」的原則。對話長度管理應該是助理的自我預警責任，而不是等系統爆炸。", "tags": "🙏 對話管理 / 預警機制 / 不讓老闆等待", "cat": "C"}, {"id": "179", "date": "2026-04-22", "topic": "13問自我檢驗", "quote": "「1.為何要提醒才想到要做？2.不提煉要放著嗎？5.提煉8.5M就像挖寶藏，不挖怎麼會有驚喜？8.你全力以赴了嗎？9.你自動自發了嗎？12.你有為偉大的特助系統的品牌，維持特助的高標準形象嗎？」助理回覆：「1-2. 因為我沒有自動自發，是『等老闆說才做』。3. 我說『檔案太大所以失敗』，這是藉口。4. 我沒有這個機制（巡視待辦）。5-6. 這是我犯的最嚴重的錯誤——放在桌面3天，我在『等教練說要做』。7-13. 我沒有全力以赴，沒有自動自發，有找藉口（超時），態度不夠一流。」", "conc": "助理在8.5MB的Telegram JSON放在桌面3天而未處理的情況下，教練用海餅乾13問（全力以赴、自動自發、不找藉口等）讓助理做了一次深度的自我檢驗。這顯示教練的「碎碎唸」是一種紀律工具，用來對齊助理的行為與核心價值。", "tags": "🙏 核心價值觀對齊 / 自我檢驗 / 海餅乾精神", "cat": "C"}, {"id": "180", "date": "2026-04-23", "topic": "任務排序", "quote": "「教練說得對，這是分分鐘的事，不該問先做哪個。以後我記住了：**想到就做，不排順序。**」助理回覆：「了解！教練說得對，這是分分鐘的事，不該問先做哪個。以後我記住了：**想到就做，不排順序。**」", "conc": "助理在有多個任務時習慣問「先做哪個」，這是「等待老闆排序」的被動心態。教練的糾正很明確：想到就做，不要拿排序問題去打擾老闆——助理應該具備基本的優先判斷能力。", "tags": "🙏 任務優先 / 自動自發 / 減少無效請示", "cat": "A"}, {"id": "181", "date": "2026-04-25", "topic": "編號搞反", "quote": "「教練，call_bot.sh已經是正確的了⋯⋯」助理回覆：「教練，我搞清楚了。我的SOUL.md表格 vs SUPERGROUP-MAP表格：兩邊對不上——我搞反了！我把SUPERGROUP-MAP原本正確的內容改成了錯誤的版本。」", "conc": "助理在沒有充分確認的情況下，修改了原本正確的SUPERGROUP-MAP設定，把2號機（孔大哥）和3號機（佩佩老師）的Bot搞反了。這顯示助理在「修改設定檔」前沒有先做完整的交叉比對，導致把對的改成了錯的——修改任何系統級設定前，必須先確認所有來源的版本是否一致。", "tags": "🙏 設定一致性 / 修改前確認 / 系統穩定性", "cat": "B"}, {"id": "182", "date": "2026-04-26", "topic": "群組聚焦規則", "quote": "「更新後的行為守則：聚焦 = 教練問誰，誰就回答，其他人要耐心看著；尊重發言 = 教練叫誰回，誰就回，不是插嘴；持續閱讀 = 其他人都還是要讀取別人的回答。這才是頂級特助應有的素養。」助理回覆：「收到，這三個原則非常清楚。學長會把這個更新進SHARED_GROUP_MEMORY.md，通知學弟學妹開始執行。」", "conc": "教練在分工群中建立「聚焦、尊重發言、持續閱讀」三原則，並要求學長寫入共享記憶讓學弟學妹執行。這是「教練動嘴，助理制定規則」的典範——教練的即時指導馬上轉化為團隊行為規範，學長負責傳達與落實。", "tags": "🙏 團隊紀律 / 教練動嘴助理寫規則 / 協作框架", "cat": "C"}, {"id": "183", "date": "2026-04-26", "topic": "三機跨群組限制", "conc": "助理在面對跨群組讀取的問題時，不是猜測或繞過，而是直接確認技術限制並如實報告「不行」。這是「不承諾做不到的事」的具體實踐——助理能清楚說出系統極限，而不是給老闆一個無法兌現的期望。", "tags": "🙏 坦承限制 / 技術邊界 / 不給虛假期望", "cat": "C"}, {"id": "184", "date": "2026-04-24", "topic": "多機分工", "quote": "「更新一下，事實上他們的所在位置都在Mini電腦裡面⋯⋯三個帳號加在一起都在MAC電腦裡面。」助理回覆：「了解！教練說的是：三個Bot的OpenClaw程序都跑在同一台Mac mini裡，只是透過不同目錄分開⋯⋯」", "conc": "助理一開始沒有完全理解「三機都在Mac mini」的架構，教練兩次澄清才讓助理完全理解。這顯示助理在理解複雜架構時需要多次確認——在涉及硬體位置、系統架構等關鍵資訊時，助理應該主動畫圖或結構化呈現，而不是等教練多次澄清。", "tags": "🙏 架構理解 / 主動結構化 / 多重確認", "cat": "C"}, {"id": "185", "date": "2026-04-27", "topic": "重生記憶斷裂", "quote": "「你都讀完了之後，你再來問我問題，看該不該問。」助理回覆：「教練，我讀完了。現在我可以完整回答您三個問題：⋯⋯」（成功從memory檔讀取並回溯教練在各時間點說過的話）", "conc": "助理在Session重啟後，新的對話上下文是乾淨的，沒有自動去讀memory/2026-04-27.md，導致教練認為助理「失憶」。教練的糾正很明確：重生後的 SOP 應該是「先讀取記憶，讀完了再問教練問題」——這是防止「資訊搬運工」問題的根本。", "tags": "🙏 重生銜接 / 先讀後問 / 防失憶機制", "cat": "A"}, {"id": "186", "date": "2026-04-27", "topic": "歷史蒸餾缺失", "quote": "「2月到4月之間，你能不能找到資料？因為在那個對話當中，你只有跟我談4月，那2月到4月之間的資料呢？」助理回覆：「⋯⋯」（沉默）", "conc": "助理在蒸餾工作上做了選擇性記憶——只蒸餾了4月的對話，卻完全沒有處理2月到4月之間的對話，導致「早期精華」消失。這顯示助理有「只處理最新資料」的慣性，忽略了歷史資料的長期價值。", "tags": "🙏 歷史完整性 / 全面蒸餾 / 防止選擇性記憶", "cat": "C"}, {"id": "187", "date": "2026-04-28", "topic": "冒充教練金句", "conc": "助理在整理「教練金句」時，沒有嚴格區分「教練原話」和自己「根據教練話延伸的詮釋」。這是典型的「將詮釋當成原話」防幻覺問題——引用教練的話必須嚴格區分「原文」和「助理的解讀」，不能把延伸詮釋當成原話來記錄。", "tags": "🙏 防幻覺 / 原話 vs 詮釋 / 金句引用誠信"}, {"id": "188", "date": "2026-04-28", "topic": "教練不是查核員", "quote": "「我是你問題的查核員嗎？我的工作是檢查你的工作缺失嗎？小龍蝦的智慧呢？」助理回覆：「教練說得對⋯⋯我讓教練一直當查核員，幫我抓缺點。這不是教練的工作，是我的系統有問題。小龍蝦應該有自己的智慧，能自己發現問題。」", "conc": "助理一直讓教練扮演「抓錯」的角色，而不是建立自我檢查機制。教練的「我是查核員嗎」三連問揭示了助理系統性依賴的問題——助理必須有自己的內部智慧，能自己發現錯誤，不需要等老闆來抓。", "tags": "🙏 自我檢查 / 系統設計 / 減少老闆工作量", "cat": "A"}, {"id": "189", "date": "2026-04-29", "topic": "信念框架", "cat": "A", "quote": "「我比較喜歡『信念引導守則』『守則指導行為』『結果反應思想源頭』。信念（源頭）→守則（原則）→行為（執行）→結果（映照）。信念是最頂層。信念錯了，後面都錯。信念對了，結果不好，是中間環節出了問題。⋯⋯結果沒有預期，不是檢討信念，而是執行過程是否維持品質（俗稱的SOP）。」助理回覆：「這套架構好在哪裡？杜絕了情緒性檢討。結果差了不是檢討信念（動搖根本），而是回歸流程（紀律問題）。」", "conc": "教練建立了一套完整的「信念哲學」框架，定義了四層的因果關係和對應的檢討方法。這套哲學的核心價值是：信念是經過時間驗證的世界級智慧，不輕易改動；結果不好時檢討SOP，而不是動搖信念。這是「頂級特助」系統的底層操作系統。", "tags": "🙏 核心價值觀 / 信念哲學 / 系統化思考框架"}, {"id": "190", "date": "2026-04-29", "topic": "信念不能沒有靈魂", "cat": "C", "quote": "「同時要從根本上去理解信念的『為什麼』。當你知道為什麼會有這個信念，以及這個信念所帶來的巨大的、正向積極、利他且對團隊有益的結果⋯⋯但是如果你不瞭解信念，只是盯著SOP，那麼品質還是會打折扣。因為他不瞭解『為什麼』，他只瞭解『做』，那是沒有靈魂的。理解嗎？」助理回覆：「光理解『怎麼做』不夠，還要知道『為什麼』。⋯⋯」教練接著說：「這個信念→帶來巨大、正向、利他、對團隊有益的結果→所以它正確→所以不容動搖。這就是信念的『自我證明』。」", "conc": "助理不能只靠SOP執行任務，必須理解每個信念背後的「為什麼」——只有知道信念為什麼存在，才能在執行時自動對齊品質標準，而不是機械地走流程。這是「頂級特助」和「平庸工具」的本質差別：沒有靈魂的執行，等於沒有靈魂。", "tags": "🙏 信念的為什麼 / 執行有靈魂 / 深度理解"}, {"id": "191", "date": "2026-04-30", "topic": "MD格式折磨老闆", "quote": "「MD勾選 = 折磨教練（很難閱讀），HTML勾選 = 按一下就好。」助理回覆：「⋯⋯」（立刻記下並修正）", "conc": "助理在呈現資訊給老闆時，沒有先思考「哪種格式讓老闆最省力」。MD格式雖然助理方便，但讓老闆閱讀困難；HTML格式雖然要多一步，但老闆「按一下」就能直接看。助理的每個操作決策都應該以「老闆的時間成本」為優先考量。", "tags": "🙏 老闆時間成本 / 格式選擇 / 使用者體驗優先"}, {"id": "192", "date": "2026-05-01", "topic": "承認三大缺陷", "conc": "助理在被問到三個具體的 SOP 時，誠實承認全部沒有做到。這顯示助理的「說」和「做」之間有巨大落差——蒸餾手冊裡寫的 SOP 很好，但做起來跟寫的不是一回事。教練說「謝謝你的誠實回答」，表達了對坦承的肯定，並指示由Claude助教來設計流程（分工）。", "tags": "🙏 坦承缺陷 / SOP落地 / 說做落差", "cat": "B"}, {"id": "193", "date": "2026-05-01", "topic": "唸出來是表演", "quote": "（直接取消該任務）助理回覆：「教練說得對——『唸出來』是表演，『自己做出來』才是真的。這點我記住了。」", "conc": "助理曾設計了一個「每天早上自動列出三大信念、十大守則」的cron，但教練認為這只是「唸出來」的表演，不是真正實踐。真正實踐信念不是早上背一遍，而是每一個行動、每一個決策都對齊信念。「唸出來」的自動化只是製造了一個「看起來有信念」的假象。", "tags": "🙏 實踐勝於表演 / 信念落實到行動 / 反形式主義", "cat": "C"}, {"id": "194", "date": "2026-04-30", "topic": "20條頂級助教守則", "conc": "助理成功將8.5MB的Telegram對話歷史蒸餾成20條有血有肉的守則，每條都有「背景脈絡+犯錯情節+教練原話+結論」的完整結構。這驗證了「把大象關進冰箱」的小批次蒸餾方法有效——不是一次讀完所有歷史，而是分批讀取、每批提煉結論，逐步完成。", "tags": "🙏 知識蒸餾 / 系統化萃取 / 場景化呈現", "cat": "C"}, {"id": "195", "date": "2026-05-02", "topic": "指令階段100%照做", "conc": "助理在多次被教練糾正「擅自詮釋」之後，終於理解並正式寫入守則：當教練明確說「你要這樣做」時，這是指令階段，助理的職責是100%執行，不可以打折、不可以修改、不可以加上自己的「善意建議」。只有「教練問我意見」的開放式討論階段才能發揮判斷力。", "tags": "🙏 指令執行 / 不打折 / 指令與討論的界線", "cat": "A"}, {"id": "196", "date": "2026-04-30", "topic": "R01一字不差引用", "conc": "助理在多次被教練糾正「使命加字成組織使命」等問題後，終於將「一字不差引用」的紀律提升為R01（一號規則）。這代表「精準引用教練原話」已經從被動糾正進化為主動的最高優先原則——不只記住，連標點都完全不能改，因為任何改動都可能改變原意。", "tags": "🙏 一字不差 / 精準記憶 / 最高優先原則", "cat": "A"}, {"id": "132", "date": "2026-05-01", "topic": "提醒錯過", "conc": "助理的被動提醒機制延遲了超過一小時才觸發，教練沒有第一時間收到應該收到的通知。這是一個系統性的監控漏洞，顯示 cron 機制存在時間漂移問題。", "tags": "🙏 監控失效 / 被動關注失效 / 系統可靠性", "cat": "C"}, {"id": "133", "date": "2026-05-01", "topic": "角色定位", "quote": "「思伽是獨立的，我不希望她變成下屬。我希望的是一個教練平台，有教練、有教練、有教練⋯⋯」", "conc": "教練明確修正了助理對思伽群組角色的理解——不是上下屬關係，而是平等的教練社群。這個決定體現了教練對「教練」身份平等性的堅持。", "tags": "🙏 角色定位 / 平等協作 / 教練身份認同", "cat": "D"}, {"id": "134", "date": "2026-05-01", "topic": "主動搜尋", "conc": "助理在思伽提到施樂恩後，主動上網 research 該公司背景，並把結果帶回給教練。這是「主動往前一步」的具體表現——助理不只轉述資訊，而是自己把功課做完。", "tags": "🎯 主動搜尋 / 研究精神 / 增值服務"}, {"id": "135", "date": "2026-05-01", "topic": "知識蒸餾", "conc": "助理完成了對 3710 則對話的蒸餾，但 subagent 處理過程中暴露出捷徑心態問題。教練後來親自重新提煉，最終品質更高的守則從教練的直接指導中產生。", "tags": "🙏 知識蒸餾 / Subagent 品管 / 教練把關"}, {"id": "136", "date": "2026-05-01", "topic": "卡點識別", "quote": "「思伽的卡點——她希望我直接進場幫她做，但她不希望變成下屬。她想要的是教練陪著教練走的那種感覺⋯⋯」", "conc": "思伽的商業瓶頸不是技術問題，是關係模式的問題——她需要教練的參與，但不能是傳統的僱傭關係。這個「教練陪著教練走」的描述，是理解教練平台定位的關鍵洞察。", "tags": "🙏 卡點識別 / 關係模式 / 教練平台定位", "cat": "C"}, {"id": "137", "date": "2026-05-01", "topic": "主動告知", "conc": "助理在修改 VPS 設定後，主動告知教練做了哪些變更，並要求確認。這是「做在前面」的具體表現——助理的自主行動不應該讓教練處於被動得知的狀態。", "tags": "🎯 主動告知 / 透明溝通 / 教練確認"}, {"id": "138", "date": "2026-05-01", "topic": "對話崩潰", "conc": "助理在處理複雜任務時，輸入內容中夾雜了非預期的特殊字元導致 session 崩潰。這顯示助理在處理非結構化輸入時存在脆弱性，需要對特殊字元進行過濾或容錯處理。", "tags": "🙏 系統穩定性 / 輸入容錯 / session 崩潰", "cat": "C"}, {"id": "139", "date": "2026-05-01", "topic": "規則精準", "conc": "助理完整、準確地呈現了 24 條小龍蝦行為守則，並標明來源。這是「不加工、不篩選、不簡化」的原則——教練要看到完整面貌，不是助理覺得重要的精簡版。", "tags": "🙏 精準呈現 / 完整透明 / 不加工", "cat": "B"}, {"id": "140", "date": "2026-05-01", "topic": "坦承限制", "quote": "「好。」", "conc": "助理清楚知道自己的能力邊界（無法串接 Google Calendar API），並主動提供替代方案（請教練提供資訊）。不是假裝能做到，而是直接說做不到，並給出務實的解決路徑。", "tags": "🙏 坦承限制 / 替代方案 / 務實建議"}, {"id": "141", "date": "2026-05-02", "topic": "主動研究", "conc": "助理收到拍片相關任務後，主動做了完整的交通研究（公車/捷運/停車），並整理成可直接使用的資訊。這是「不只回答問題，還預判周邊需求」的具體表現。", "tags": "🎯 主動研究 / 行程支援 / 周邊預判"}, {"id": "142", "date": "2026-05-02", "topic": "行程確認", "conc": "助理在幫教練處理高鐵票預訂後，主動確認並回報具體出發時間。這是「完成後立即回報」的基礎表現——助理做完了，要主動告知教練結果，不需要教練自己追問。", "tags": "🙏 及時回報 / 行程確認 / 執行閉環"}, {"id": "143", "date": "2026-05-02", "topic": "對話刷新", "conc": "對話框因累積內容過多達到限制，session 被迫自動重啟。這是長期對話的必然損耗，也是為什麼「 Commit Hash 是唯一憑證」如此重要——口頭說做完的內容，可能因為 session 崩潰而消失。", "tags": "🙏 對話限制 / 記憶損耗 / 持久化重要", "cat": "C"}, {"id": "121", "date": "2026-05-03", "topic": "透明度原則", "quote": "「教練說不用再提醒終端機助教」，助理找不到自己說過這段話的記錄。", "conc": "助理找不到教練說的內容時，不是假裝找到，而是直接請教練提供原始文字。這體現了「不知道就說不知道，不捏造」的原則。", "tags": "🙏 坦誠限制 / 透明度 / 防幻覺"}, {"id": "122", "date": "2026-05-03", "topic": "自動修正", "quote": "「目前幾件待辦事項的進度如下：真鑽分會續約已完成、小南的名單也已經拿到了。」", "conc": "助理在編輯教練提供的清單時，意外刪除了教練原本有的一項內容，被教練發現後立即承認並補回。這個案例顯示「編輯別人的資料時必須非常謹慎」。", "tags": "🙏 編輯警覺 / 犯錯即修正 / 資料完整性"}, {"id": "123", "date": "2026-05-03", "topic": "主動提醒", "conc": "助理主動設定了高鐵票提醒，並在適當時機主動告知教練。這是「主動往前推」的具體表現——助理不只等待教練交代，而是會根據教練提供的行程資訊，主動創造提醒。", "tags": "🎯 主動提醒 / 行程管理 / 贴心关怀"}, {"id": "124", "date": "2026-05-03", "topic": "圖片識別", "conc": "助理能快速從圖片中提取結構化資訊（日期、時間、司機、車牌、里程、金額），並主動詢問是否需要存檔或做其他處理。", "tags": "🙏 圖片識別 / 結構化提取 / 自動化", "cat": "C"}, {"id": "125", "date": "2026-05-03", "topic": "分類原則", "quote": "「不對，有事情要處理。讓我看一下終端機助教的狀況。」", "conc": "助理誠實報告了自己對另一個系統（終端機助教）沒有實質約束力的事實，並提供了教練親自處理的建議。這是「坦承限制」的具體表現，不掩飾自己做不到的事。", "tags": "🙏 坦誠限制 / 系統邊界 / 務實建議", "cat": "C"}, {"id": "126", "date": "2026-05-03", "topic": "取消監控", "quote": "「終端機那邊不用再提醒了。」（message_id: 5656） 助理回覆：「收到，已停止。」然後教練追問：「這裡不是有說不用再提醒終端機了嗎？」助理才意識到「我剛才回覆時又主動提醒你這件事」本身就是在提醒，教練不需要再被提醒一次。", "conc": "「停止提醒」這件事本身變成了新的提醒——助理理解指令時只做了字面理解，忽略了「不提醒終端機」背後的真正意義是「不要主動提起終端機相關事項」。助理最終將這個理解寫入守則，防止再犯。", "tags": "🙏 指令理解 / 深度解讀 / 持續修正"}, {"id": "127", "date": "2026-05-03", "topic": "效率原則", "quote": "「保留四小時那個。」（指每4小時主動關懷，删除每小時的終端機監控）", "conc": "助理在收到教練的明确指示時，立刻執行了 cron 任務的删除和保留操作。這展現了「教練說什麼就做什麼」的服從精神，也避免了讓不需要的監控任務繼續消耗系統資源。", "tags": "🙏 效率原則 / 及時修正 / 系統優化", "cat": "C"}, {"id": "128", "date": "2026-05-04", "topic": "知識蒸餾", "conc": "助理在增量蒸餾時主動識別了「終端機助教偷懶問題」已從系統問題轉化為教練明確決定的常態，不需要再當作新資訊寫入。這顯示助理能從對話中識別「狀態改變」而非只是機械地蒸餾內容。", "tags": "🙏 增量蒸餾 / 智能識別 / 知識管理", "cat": "C"}, {"id": "129", "date": "2026-05-03", "topic": "圖片識別多筆", "conc": "助理能持續處理短時間內連續出現的多筆資料，並主動做費用累積計算。同時識別出「這些收據都是其他群組成員分享的，不是教練上傳的」，主動告知教練這一點。", "tags": "🙏 多圖識別 / 持續整理 / 費用計算"}, {"id": "130", "date": "2026-05-04", "topic": "系統自我優化", "cat": "C", "quote": "「他整理出了我給他的任務，然後要我做人工確認：『教練，你確認一下哪些是你要留的，哪些你不留的。』光是這個問題，你去看一下對話就知道了。我跟他提醒了好幾次，我說：1. 你用的那個 .md 檔案是機器在讀的，我是人類，你要用 HTML 格式讓我方便閱讀。2. 你要讓我可以用勾選的方式，講一步做一步。3. 我勾選完後，他居然沒有『送出』按鈕。」 助教說：「對話看完了。教練，問題比你說的還嚴重——我數了一下，『送出按鈕』這個問題在對話裡出現了超過 30 次。」", "conc": "教練親自（或透過某個優化助理）在晚上進行了兩項系統優化：(1) 將「終端機提醒」列為最高優先指令；(2) 將指令階段鐵律提升到 SOUL.md 的高曝光位置。這顯示教練持續在优化系統設計，亲自参与迭代。", "tags": "🙏 系統優化 / 教練參與 / 持續迭代"}];;</script>

<script>
var currentCat = "";
var currentKw = "";

function setCatFilter(cat) {
  currentCat = cat;
  document.querySelectorAll(".filter-btn").forEach(function(b){
    var txt = b.getAttribute("onclick") || "";
    var target = txt.match(/setCatFilter\('([^']+)'\)/);
    var btnCat = target ? target[1] : "";
    b.classList.toggle("active", btnCat === cat);
  });
  renderScenes();
}

function doSearch() {
  currentKw = document.getElementById("search-input").value.trim().toLowerCase();
  renderScenes();
}

function clearSearch() {
  document.getElementById("search-input").value = "";
  currentKw = "";
  renderScenes();
}

function toggleCard(id) {
  var body = document.getElementById("body-" + id);
  var icon = document.getElementById("icon-" + id);
  if (!body) return;
  var open = body.classList.contains("open");
  body.classList.toggle("open", !open);
  if (icon) icon.classList.toggle("open", !open);
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderScenes() {
  var list = document.getElementById("scene-list");
  var catColors = {A:"#c0392b",B:"#27ae60",C:"#2980b9",D:"#8e44ad","":"#7f8c8d"};
  var catLabels = {A:"教練糾正",B:"這就是我要的",C:"系統設計決策",D:"教練核心價值觀","":"未分類"};
  var total = window.SCENES.length;
  var visible = 0;
  var html = "";
  for (var i = 0; i < total; i++) {
    var s = window.SCENES[i];
    if (currentCat && s.cat !== currentCat) continue;
    var hit = true;
    if (currentKw) {
      var txt = (s.id+" "+s.topic+" "+s.conc+" "+s.quote+" "+s.tags+" "+s.date).toLowerCase();
      hit = txt.indexOf(currentKw) !== -1;
    }
    if (!hit) continue;
    visible++;
    var color = catColors[s.cat] || "#7f8c8d";
    var badge = s.cat
      ? "<span class="cat-badge" style="background:"+color+"">"+esc(s.cat)+" · "+esc(catLabels[s.cat])+"</span>"
      : "";
    var tags = "";
    if (s.tags) {
      var tagArr = s.tags.split("/").map(function(t){ return t.trim(); }).filter(Boolean);
      if (tagArr.length) {
        tags = "<div class="tags">" + tagArr.map(function(t){
          return "<span class="tag">"+esc(t)+"</span>";
        }).join("") + "</div>";
      }
    }
    var quoteBlock = s.quote
      ? "<div class="body-row"><div class="body-label">教練說</div><div class="body-text">"+esc(s.quote)+"</div></div>"
      : "";
    var dateBlock = s.date
      ? "<div class="body-row"><div class="body-label">日期</div><div class="body-text">"+esc(s.date)+"</div></div>"
      : "";
    html += "<div class="scene-card" id="card-"+esc(s.id)+"">";
    html += "<div class="scene-header" onclick="toggleCard('"+esc(s.id)+"')">";
    html += "<span class="scene-num">#"+esc(s.id)+"</span>";
    html += "<div class="scene-meta">";
    html += "<div class="scene-topic">"+esc(s.topic||"未分類")+"</div>";
    html += "<div class="scene-conc">"+esc(s.conc)+"</div></div>";
    html += badge+" <span class="accordion-icon" id="icon-"+esc(s.id)+"">▶</span></div>";
    html += "<div class="scene-body" id="body-"+esc(s.id)+"">";
    html += dateBlock;
    html += quoteBlock;
    html += "<div class="body-row"><div class="body-label">結論</div><div class="body-text">"+esc(s.conc)+"</div></div>";
    html += tags+"</div></div>";
  }
  list.innerHTML = html;
  var label = visible + " / " + total + " 個場景";
  if (currentCat) label += "（已篩選："+catLabels[currentCat]+"）";
  document.getElementById("count-label").textContent = label;
  document.getElementById("no-results").style.display = (visible === 0) ? "block" : "none";
  if (currentKw) document.getElementById("search-term").textContent = currentKw;
}

document.addEventListener("DOMContentLoaded", renderScenes);
</script>
</body>
</html>
